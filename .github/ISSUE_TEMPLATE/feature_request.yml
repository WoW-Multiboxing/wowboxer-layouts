name: Idea or layout request
description: A new layout, setting or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The app only moves, resizes and restyles windows. Ideas that send keys or clicks to the game, read game memory
        or automate logins cannot be accepted (see CONTRIBUTING.md).
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Clients, monitors, game. A sketch or screenshot of the layout helps.
