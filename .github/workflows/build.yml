name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WoWBoxer.Layouts.slnx

      - name: Build
        run: dotnet build WoWBoxer.Layouts.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WoWBoxer.Layouts.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Start-up check (the app opens its main window)
        shell: pwsh
        run: ./tools/smoke-start.ps1 -Exe src/WoWBoxer.Layouts.App/bin/Release/net10.0-windows/WoWBoxer.Layouts.exe

      # Demo mode renders every screen with WPF's own renderer (no real windows, monitors or network), so it works here.
      - name: Website screenshots (demo mode)
        shell: pwsh
        run: ./tools/make-screenshots.ps1 -Exe src/WoWBoxer.Layouts.App/bin/Release/net10.0-windows/WoWBoxer.Layouts.exe -Out out/site-screenshots

      - name: Upload website screenshots
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: out/site-screenshots

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
