name: build

# Every push to any branch (feature/* included) and every pull request. main only takes green builds
# (docs/release-process.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WoWBoxer.Layouts.slnx

      - name: Build
        run: dotnet build WoWBoxer.Layouts.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WoWBoxer.Layouts.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Start-up check (the app opens its main window)
        shell: pwsh
        run: ./tools/smoke-start.ps1 -Exe src/WoWBoxer.Layouts.App/bin/Release/net10.0-windows/WoWBoxer.exe

      # Demo mode renders every screen with WPF's own renderer (no real windows, monitors or network), so it works here.
      - name: Website screenshots (demo mode)
        shell: pwsh
        run: ./tools/make-screenshots.ps1 -Exe src/WoWBoxer.Layouts.App/bin/Release/net10.0-windows/WoWBoxer.exe -Out out/site-screenshots

      # The "WoWBoxer Dev" flavour (tools/dev-build.ps1) must keep compiling and starting too.
      - name: Dev build flavour compiles and starts
        shell: pwsh
        run: |
          dotnet publish src/WoWBoxer.Layouts.App -c Release -r win-x64 --self-contained false --artifacts-path out/dev-build -o out/dev -p:WbxDev=true
          if ($LASTEXITCODE -ne 0) { throw "dev publish failed" }
          $d = (Get-Item out/dev/WoWBoxer.exe).VersionInfo.FileDescription
          if ($d -ne 'WoWBoxer Dev') { throw "Expected FileDescription 'WoWBoxer Dev', got '$d'" }
          ./tools/smoke-start.ps1 -Exe out/dev/WoWBoxer.exe -DataFolder Dev

      - name: Update channel checker compiles
        run: dotnet build tools/channel-check -c Release

      - name: Upload website screenshots
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: out/site-screenshots

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
